model_list:
  - model_name: qwen
    litellm_params:
      model: openai/qwen3
      api_base: http://localhost:8000/v1
      api_key: "nao-precisa"
      max_tokens: 16384
      streaming: true
    model_info:
      # Context Window Math (ver infra/README.md): a janela TOTAL do llama-server e
      # N_CTX=106496. Dela reservamos 16384 para a geracao, sobrando 90112 de entrada.
      # context_window precisa existir explicitamente, senao fica ambiguo se a janela
      # total e 90112 ou 90112+16384 — e o cliente calcula a compactacao errado.
      #
      # A saida subiu de 8192 para 16384 em 2026-07-28: escrever um HTML inteiro nao
      # cabia em 8192 e o turno morria com stopReason=length ("Agent couldn't generate
      # a response"). Precisa bater com N_PREDICT no .env do llama-server.
      context_window: 106496
      max_input_tokens: 90112
      max_output_tokens: 16384
      input_cost_per_token: 0.0000000336
      output_cost_per_token: 0.0000000336

litellm_settings:
  # false nos dois de proposito: queremos que um parametro nao suportado pelo backend
  # vire ERRO visivel, em vez de ser descartado/reescrito em silencio. Silencio aqui foi
  # o que dificultou depurar o thinking (nao dava para saber o que chegava no llama-server).
  drop_params: false
  modify_params: false
