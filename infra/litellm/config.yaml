model_list:
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://localhost:18020/v1
      api_key: "vllm-local"
      max_tokens: 32000
    model_info:
      # Qwen3.8-27B AutoRound+DFlash2 (vLLM 0.33 TP=2, max_model_len 142080),
      # ~15,6GB/GPU, sem visão (--language-model-only).
      # O servidor já aplica presence_penalty 1.0, teto de thinking e alarme de
      # repetição por default; o loop-guard abaixo só pega tool_calls.
      mode: chat
      context_window: 140000
      max_input_tokens: 120000
      max_output_tokens: 32000
      supports_function_calling: true
      supports_tool_choice: true
      supports_vision: false

litellm_settings:
  drop_params: true
  modify_params: false

guardrails:
  - guardrail_name: "loop-guard"
    litellm_params:
      guardrail: loop_guard.LoopGuard
      mode: "post_call"
      default_on: true