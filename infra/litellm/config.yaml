model_list:
  - model_name: qwen3.6-27b
    litellm_params:
      model: openai/qwen3.6-27b
      api_base: http://localhost:8080/v1
      api_key: "sk-litellm-master"
      max_tokens: 65536
    model_info:
      # Context Window: Qwen3.6-27B Q4_K_M + MTP n=3, llama.cpp, 262k ctx
      mode: chat
      context_window: 262144
      max_input_tokens: 196608
      max_output_tokens: 65536
      supports_function_calling: true
      supports_tool_choice: true
      supports_vision: false

  - model_name: qwen3-vl-4b-vision
    litellm_params:
      model: openai/qwen3-vl-4b
      api_base: http://localhost:8081/v1
      api_key: "sk-litellm-master"
      max_tokens: 4096
    model_info:
      # Context Window: Qwen3-VL 4B Q4_K_M + mmproj f16, llama.cpp, 32k ctx
      mode: chat
      context_window: 32768
      max_input_tokens: 28672
