model_list:
  - model_name: ornith
    litellm_params:
      model: openai/ornith
      api_base: https://llm.loadstask.com/v1
      api_key: "sk-litellm-master"
      max_tokens: 16384
    model_info:
      # Context Window: Ornith 35B Q4_K_XL, llama.cpp, 128k ctx
      mode: chat
      context_window: 131072
      max_input_tokens: 114688
      max_output_tokens: 16384
      supports_function_calling: true
      supports_tool_choice: true

litellm_settings:
  drop_params: true
  modify_params: false

guardrails:
  - guardrail_name: "loop-guard"
    litellm_params:
      guardrail: loop_guard.LoopGuard
      mode: "post_call"
      default_on: true